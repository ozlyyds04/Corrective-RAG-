[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corrective-rag"
version = "0.1.0"
description = "Corrective RAG agent: LangGraph + Qdrant dense/sparse hybrid retrieval, RSS reranking, deepseek-v4-flash generation, Tavily web search, FastAPI + Vue3 UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.122.0",
    "beautifulsoup4",
    "docx2txt",
    "fastapi>=0.115",
    "jieba==0.42.1",
    "langchain==1.3.15",
    "langchain-community==0.4.2",
    "langchain-core==1.5.5",
    "langchain-openai==1.5.1",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.11",
    "numpy==2.5.2",
    "openai==3.1.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.9",
    "PyYAML==6.0.3",
    "qdrant-client==1.19.0",
    "redis>=5.0",
    "tavily-python==0.7.27",
    "tenacity==9.1.4",
    "tiktoken==0.13.0",
    "uvicorn[standard]>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corrective_rag"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
