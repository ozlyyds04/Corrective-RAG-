services:
  api:
    build: .
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  web:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # 如使用本地 Qdrant，可在此启用；否则将 .env 中 QDRANT_URL 指向云端集群即可
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
