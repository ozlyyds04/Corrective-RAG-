      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="760" height="1110" fill="#ffffff"/>

  <!-- ===================== Edges ===================== -->
  <g fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)">
