    <path d="M 380 340 L 380 370"/>
    <path d="M 380 430 L 380 460"/>
    <path d="M 380 530 L 380 570"/>
    <path d="M 380 630 L 380 660"/>
    <path d="M 380 720 L 380 750"/>
