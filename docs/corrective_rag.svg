    <path d="M 300 780 L 180 780 L 180 860"/>
    <path d="M 380 810 L 380 960"/>
    <!-- Query Rewrite -> Web Search -> Generation -->
    <path d="M 250 890 L 470 890"/>
    <path d="M 545 920 L 545 940 L 460 940 L 460 990"/>
    <!-- Generation -> Answer -->
    <path d="M 380 1020 L 380 1050"/>
  </g>

  <!-- Knowledge Base side connector (dashed) -->
  <path d="M 220 495 L 300 495" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ===================== Nodes ===================== -->
