    <rect x="300" y="370" width="160" height="60"/>
    <rect x="300" y="460" width="160" height="70"/>
    <rect x="70"  y="460" width="150" height="70"/>
    <rect x="300" y="570" width="160" height="60"/>
    <rect x="300" y="660" width="160" height="60"/>
    <rect x="300" y="750" width="160" height="60"/>
    <rect x="110" y="860" width="140" height="60"/>
